# Custom (non-standard) tcodes — pattern-based classification.
custom_pattern_rules:
  - matches: "Z_HACK*"
    category: suspicious_custom
    risk_level: critical
  - matches: "ZRFC_*"
    category: suspicious_custom
    risk_level: critical
  - matches: "/MVNT/*"
    category: custom_application_admin
    risk_level: high
  - matches: "ZMVNT_*"
    category: custom_application_admin
    risk_level: high
  - matches: "Y_EXPORT*"
    category: data_access
    risk_level: high
  - matches: "Z_*EXPORT*"
    category: data_access
    risk_level: high
  - matches: "Z_PAY*"
    category: financial_posting
    risk_level: high
  - matches: "Z_AUTH*"
    category: authorization
    risk_level: critical
  - matches: "Z_RFC*"
    category: system_config
    risk_level: critical
  - matches: "Z_*"
    category: custom_program
    risk_level: medium
  - matches: "Y_*"
    category: custom_program
    risk_level: medium
