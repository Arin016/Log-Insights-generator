# SAP Tcode Catalog
#
# Classification index for deterministic scope filtering.
# Categories drive the filter engine; custom_pattern_rules handle Z_*/Y_* tcodes.
#
# RULE: Each tcode appears in exactly ONE category (its primary classification).
# Use cases pull in cross-category tcodes via operation_matches.

