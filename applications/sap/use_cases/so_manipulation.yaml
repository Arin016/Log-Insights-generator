use_case: so_manipulation
description: |
  Detect sales order fraud patterns: SO quantity/value inflation, reopening
  completed orders to add items, unauthorized pricing changes, delivery
  block removal, credit limit bypass, sales order splitting, billing
  manipulation (cancellation/re-billing at different values), returns fraud,
  and revenue recognition fraud via schedule line manipulation.

scope_filter:
  match_any:
    # Primary categories
    - operation_category_in:
        - sales
        - delivery_outbound
    # Cross-category tcodes relevant to SO fraud
    - operation_matches:
        - "FD32"     # customer credit management [master_data_modification]
        - "XD02"     # customer change central [master_data_modification]
    # Sales-related table classifications
    - entity_classification_in:
        - sales_transaction
        - customer_master
        - delivery_document
    # Cross-classification tables relevant to SO fraud
    - entity_matches:
        - "CDHDR"    # change document header
        - "CDPOS"    # change document position

confidence_factors:
  - sufficient_context
  - unambiguous_evidence
  - pattern_clear
  - scope_unambiguous

severity_hints:
  critical:
    - "Completed order reopened (VBUK.GBSTK C→B) then quantities increased — revenue inflation"
    - "Mass billing cancellation (VF11 × 10+) — systematic revenue leakage"
    - "Credit limit bypass: customer credit increased (FD32/KNKK) then large order released"
    - "Pricing condition manipulation: discount conditions added/changed post-order (KONV)"
    - "Order-to-cash chain: VA01 → VL01N → VF01 all by same actor in same session for new customer"
  high:
    - "SO quantity inflation: VBEP.WMENG (order quantity) increased via VA02"
    - "SO value manipulation: VBAP.NETWR (net value) or VBKD pricing changed"
    - "New schedule lines (VBEP CREATE) added to existing completed orders"
    - "Delivery block removed (VBAK.LIFSK cleared) enabling unauthorized shipment"
    - "Billing document cancelled (VF11) then re-created at different value"
    - "Customer PO reference changed (VBKD.BSTKD) — potential order duplication"
    - "Sales order partner (VBPA) changed — ship-to or bill-to redirected"
    - "Goods issue reversed (VL09) then delivery re-processed with different quantities"
    - "Customer credit limit (KNKK.KLIMK) increased during firefighter session"
    - "Credit memo created (VF21) without corresponding return delivery"
    - "Free-of-charge delivery: VBAP.UMVKZ set to zero out value"
  medium:
    - "Sales order created outside requested FF scope"
    - "Sales order displayed (VA03/VA05) as reconnaissance before modification"
    - "Delivery created (VL01N) outside scope"
    - "Customer master sales data (KNVV) modified — pricing group or incoterms changed"
    - "Billing due list processed (VF04) outside scope"
