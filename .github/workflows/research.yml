name: Synthetic research harness
on: [push, pull_request, workflow_dispatch]
jobs:
  deterministic-and-elasticsearch:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        env:
          discovery.type: single-node
          cluster.name: ff-insights-synthetic
          xpack.security.enabled: 'false'
          xpack.ml.enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        ports:
          - 19200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
        env:
          FF_ES_INTEGRATION: '1'
          PYTHON_DOTENV_DISABLED: '1'
